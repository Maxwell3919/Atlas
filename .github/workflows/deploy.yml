name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Stage exact reviewed public inputs before compilation
        run: python3 publication/stage.py --manifest publication/source-allowlist.json --destination "$RUNNER_TEMP/atlas-public"

      - name: Build with Astro
        working-directory: ${{ runner.temp }}/atlas-public
        run: npm run build

      - name: Apply public policies and verify reviewed output
        working-directory: ${{ runner.temp }}/atlas-public
        run: |
          python3 preview-policy/sanitize.py --preview dist --receipt /tmp/atlas-s139-policy.json
          python3 preview-policy/release.py --preview dist --expected publication/expected-output.json --receipt /tmp/atlas-s285-policy.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/atlas-public/dist

  deploy:
    concurrency:
      group: 'pages'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
